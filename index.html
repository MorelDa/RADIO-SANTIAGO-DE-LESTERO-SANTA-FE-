.center-content{

.album-art-wrapper{

.vinyl-center-label{
    width:32%;

    background:transparent;

}

.album-cover{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    aspect-ratio:1/1;

    box-shadow:0 12px 35px rgba(0,0,0,.6);

}

.album-cover img{

    height:100%;
    object-fit:cover;
}

.app-container.playing .vinyl-record{
    transform:translateX(75px);
    animation:spinVinyl 3s linear infinite;
}

@keyframes spinVinyl{
    from{transform:translateX(75px) rotate(0deg)}
    to{transform:translateX(75px) rotate(360deg)}
}

.audio-wave-container{
    position:absolute;
    bottom:0;
    left:0;
    width:100%;
    height:35%;
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:2px;
    z-index:2;
    pointer-events:none;
    padding:0;
}

.wave-bar{
    flex:1;
    height:10%;
    border-radius:3px 3px 0 0;
    background:linear-gradient(to top,#087cff,#00c8ff);
    box-shadow:0 0 8px rgba(0,174,255,.45);
    transition:height .05s ease;
}

    margin:0 auto;

</div>

<script>
const audioURL =
"https://stream-179.surfernetwork.com/pmfukcc4ofytv?zt=eyJhbGciOiJIUzI1NiJ9.eyJzdHJlYW0iOiJwbWZ1a2NjNG9meXR2IiwiaG9zdCI6InN0cmVhbS0xNzkuc3VyZmVybmV0d29yay5jb20iLCJydHRsIjo1LCJqdGkiOiJlSzh0Q2JEX1FTLXRZdUN6cVN1R25BIiwiaWF0IjoxNzg3OTM1MjQ4LCJleHAiOjE3ODc5MzUzMDh9.c__OvLmGLp9wLGwmLCv8ShNo72VuCMvfAS-G7JYQu7I";

const audio = new Audio(audioURL);
audio.crossOrigin = "anonymous";

let audioContext;
let analyser;
let dataArray;
let playing = false;

const playBtn = document.getElementById("playBtn");
const playIcon = document.getElementById("playIcon");
const mainContainer = document.getElementById("mainContainer");
const container = document.getElementById("wave-container");

const pwaBtn = document.getElementById("pwaBtn");
const whatsappBtn = document.getElementById("whatsappBtn");
const emailBtn = document.getElementById("emailBtn");
const shareBtn = document.getElementById("shareBtn");

const BARS_COUNT = 32;
const barElements = [];

for(let i = 0; i < BARS_COUNT; i++){
    const bar = document.createElement("div");
    bar.classList.add("wave-bar");
    container.appendChild(bar);
    barElements.push(bar);
}

function initAudioAnalyser(){
    if(!audioContext){
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 64;

        const bufferLength = analyser.frequencyBinCount;
        dataArray = new Uint8Array(bufferLength);

        const source = audioContext.createMediaElementSource(audio);
        source.connect(analyser);
        analyser.connect(audioContext.destination);
    }
}

playBtn.onclick = async () => {
    initAudioAnalyser();

    if(audioContext.state === "suspended"){
        await audioContext.resume();
    }

    if(!playing){
        try{
            await audio.play();
            playIcon.className = "fa-solid fa-pause";
            mainContainer.classList.add("playing");
            playing = true;
        }catch(error){
            console.error("Error reproduciendo audio:", error);
        }
    }else{
        audio.pause();
        playIcon.className = "fa-solid fa-play";
        mainContainer.classList.remove("playing");
        playing = false;
    }
};

/* WHATSAPP */
whatsappBtn.onclick = () => {
    window.open("https://wa.me/5493855436590", "_blank", "noopener,noreferrer");
};

/* GMAIL */
emailBtn.onclick = () => {
    window.location.href = "mailto:libertador1013@gmail.com";
};

/* COMPARTIR */
shareBtn.onclick = async () => {
    const shareData = {
        title: "FM LIBERTADOR 101.3",
        text: "🎶 Escucha FM LIBERTADOR 101.3 MATARÁ SANTIAGO DEL ESTERO 🔥",
        url: window.location.href
    };

    try{
        if(navigator.share){
            await navigator.share(shareData);
        }else{
            await navigator.clipboard.writeText(window.location.href);
            alert("Enlace copiado. Ya puedes compartir la radio.");
        }
    }catch(error){
        if(error.name !== "AbortError"){
            console.error("Error al compartir:", error);
        }
    }
};

/* INSTALACIÓN PWA */
let deferredPrompt = null;

pwaBtn.hidden = true;

window.addEventListener("beforeinstallprompt", (event) => {
    event.preventDefault();
    deferredPrompt = event;
    pwaBtn.hidden = false;
});

pwaBtn.addEventListener("click", async () => {
    if(deferredPrompt){
        deferredPrompt.prompt();

        const result = await deferredPrompt.userChoice;

        if(result.outcome === "accepted"){
            pwaBtn.hidden = true;
        }

        deferredPrompt = null;
    }else{
        alert("Si estás en iPhone, usa Compartir → Añadir a pantalla de inicio. En algunos navegadores la instalación aparece en el menú del navegador.");
    }
});

window.addEventListener("appinstalled", () => {
    deferredPrompt = null;
    pwaBtn.hidden = true;
});

/* ECUALIZADOR */
function animate(){
    if(playing && analyser){
        analyser.getByteFrequencyData(dataArray);

        let totalVolume = 0;

        for(let i = 0; i < dataArray.length; i++){
            totalVolume += dataArray[i];
        }

        let averageVolume = totalVolume / dataArray.length;

        barElements.forEach((bar,index) => {
            let rawValue = dataArray[index % dataArray.length] || 0;

            let mixedSignal =
                (rawValue * 0.4) +
                (averageVolume * 0.6);

            let dynamicFactor =
                Math.sin(index * 0.5 + Date.now() * 0.015) * 15;

            let finalHeight =
                ((mixedSignal / 255) * 85) +
                10 +
                (dynamicFactor * (averageVolume / 255));

            if(finalHeight > 100) finalHeight = 100;
            if(finalHeight < 10) finalHeight = 10;

            bar.style.height = `${finalHeight}%`;
        });

    }else{
        barElements.forEach(bar => {
            bar.style.height = "10%";
        });
    }

    requestAnimationFrame(animate);
}

animate();
</script>

<script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js")
            .catch(error => console.error("Service Worker:", error));
    });
}
</script>
